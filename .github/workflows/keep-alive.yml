name: Keep live deployment warm

on:
  schedule:
    - cron: '0 0 */4 * *' # every 4 days at midnight UTC
  workflow_dispatch:

jobs:
  keep-supabase-active:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Keep Supabase active
        run: node .github/scripts/supabase-keep-alive.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SHARED_LIST_ID: ${{ secrets.SHARED_LIST_ID }}

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: keep-supabase-active
    if: ${{ failure() }}
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skipping notification."
            exit 0
          fi
          payload=$(printf '{"content":"[Keep-alive] Workflow failed for %s\n%s\nJob: keep-supabase-active\nCommit: %s"}' "$REPO" "$RUN_URL" "$SHA")
          curl -s -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"
        shell: bash
