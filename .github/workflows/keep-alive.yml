name: Keep live deployment warm

on:
  schedule:
    - cron: '0 0 */4 * *' # every 4 days at midnight UTC
  workflow_dispatch:

jobs:
  keep-supabase-active:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure supabase client is installed
        run: |
          echo "Installing @supabase/supabase-js to ensure it's available on the runner"
          npm install @supabase/supabase-js --no-save --no-audit --no-fund
        shell: bash

      - name: Debug environment
        run: |
          echo "PWD: $(pwd)"
          echo "Node version:" && node --version || true
          echo "NPM version:" && npm --version || true
          echo "Listing repo root files:" && ls -la || true
          echo "Contents of package.json:" && sed -n '1,120p' package.json || true
          echo "Checking node_modules presence:" && ls -la node_modules || true
          echo "Checking @supabase directory:" && ls -la node_modules/@supabase || true
          echo "Attempting dynamic import of @supabase/supabase-js"
          node -e "import('@supabase/supabase-js').then(()=>console.log('import ok')).catch(e=>{console.error('dynamic import failed:', e.message||e); process.exit(1)})"
        shell: bash

      - name: Keep Supabase active
        run: node .github/scripts/supabase-keep-alive.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SHARED_LIST_ID: ${{ secrets.SHARED_LIST_ID }}
